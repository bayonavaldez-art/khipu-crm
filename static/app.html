<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Khipu CRM · Panel</title>
  <link rel="stylesheet" href="/static/css/styles.css">
</head>
<body>
  <aside class="sidebar">
    <div class="brand">
      <!-- Marca: khipu minimal (cordel + dos cuerdas con nudos) -->
      <svg class="logo" width="34" height="34" viewBox="0 0 40 40" fill="none" aria-hidden="true">
        <path d="M3 9 C 14 14, 26 14, 37 9" stroke="#e9e2d4" stroke-width="2.6" stroke-linecap="round"/>
        <line x1="13" y1="14" x2="13" y2="34" stroke="#c9bfa8" stroke-width="2"/>
        <line x1="24" y1="14" x2="24" y2="30" stroke="#c9bfa8" stroke-width="2"/>
        <rect x="9.5" y="20" width="7" height="2.6" rx="1.3" fill="#c2701d"/>
        <rect x="9.5" y="26" width="7" height="2.6" rx="1.3" fill="#c2701d"/>
        <rect x="20.5" y="22" width="7" height="2.6" rx="1.3" fill="#c2701d"/>
      </svg>
      <div>
        <strong>Khipu CRM</strong>
        <small>Académico-Comercial</small>
      </div>
    </div>

    <nav id="menu">
      <div class="nav-grupo">Operación</div>
      <button class="nav-btn active" data-vista="dashboard">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="3" width="7.5" height="7.5" rx="1.5"/><rect x="3" y="13.5" width="7.5" height="7.5" rx="1.5"/><rect x="13.5" y="13.5" width="7.5" height="7.5" rx="1.5"/></svg>
        <span>Dashboard</span>
      </button>
      <button class="nav-btn" data-vista="contactos">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9.5" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
        <span>Contactos</span>
      </button>
      <button class="nav-btn" data-vista="oportunidades">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1" fill="currentColor"/></svg>
        <span>Oportunidades</span>
      </button>
      <button class="nav-btn" data-vista="tareas">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M8 12.5l3 3 5.5-6.5"/></svg>
        <span>Tareas y alertas</span>
      </button>

      <div class="nav-grupo">Inteligencia artificial</div>
      <button class="nav-btn" data-vista="bot">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 15a2 2 0 0 1-2 2H8l-4 4V5a2 2 0 0 1 2-2h13a2 2 0 0 1 2 2z"/><line x1="8.5" y1="10" x2="8.5" y2="10.01"/><line x1="12.5" y1="10" x2="12.5" y2="10.01"/><line x1="16.5" y1="10" x2="16.5" y2="10.01"/></svg>
        <span>KhipuBot · Clasificador</span>
      </button>
    </nav>

    <div class="sidebar-footer">
      <div id="user-info" class="user-info"></div>
      <button id="btn-logout" class="btn btn-ghost btn-block">Cerrar sesión</button>
    </div>
  </aside>

  <main class="content">
    <section id="vista-dashboard" class="vista"></section>
    <section id="vista-contactos" class="vista" hidden></section>
    <section id="vista-oportunidades" class="vista" hidden></section>
    <section id="vista-tareas" class="vista" hidden></section>
    <section id="vista-bot" class="vista" hidden></section>
  </main>

  <div id="toast" class="toast" hidden></div>

  <script src="/static/vendor/chart.umd.js"></script>
  <script src="/static/js/api.js"></script>
  <script src="/static/js/views.js"></script>
  <script src="/static/js/app.js"></script>
</body>
</html>
